<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Library Portal</title>
    <link rel="stylesheet" href="forgot-password.css">
</head>

<body>

<main class="forgot-page">

    <div class="forgot-card">

        <div class="card-header">

            <div class="card-icon">
                <svg viewBox="0 0 24 24" fill="none">
                    <rect x="4" y="10" width="16" height="11" rx="2"
                        stroke="currentColor"
                        stroke-width="1.7"/>

                    <path d="M8 10V7C8 4.79 9.79 3 12 3C14.21 3 16 4.79 16 7V10"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"/>

                    <path d="M12 14V17"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"/>
                </svg>
            </div>

            <div>
                <span class="portal-label">LIBRARY PORTAL</span>
                <h1>Forgot Password</h1>
                <p>Reset your student account password</p>
            </div>

        </div>

        <div class="info-box">
            Enter your registered college email address.
            We'll send a verification email in the next phase
            when backend integration is added.
        </div>

        <form action="../verification/verification.html" method="get">

            <div class="input-group">

                <label for="email">College Email</label>

                <div class="input-wrapper">

                    <svg viewBox="0 0 24 24" fill="none">
                        <rect x="3" y="5" width="18" height="14" rx="2"
                            stroke="currentColor"
                            stroke-width="1.7"/>

                        <path d="M4 7L12 13L20 7"
                            stroke="currentColor"
                            stroke-width="1.7"
                            stroke-linecap="round"
                            stroke-linejoin="round"/>
                    </svg>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your college email"
                        required>

                </div>

            </div>

            <button type="submit" class="continue-btn">

                Continue

                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M5 12H19"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"/>

                    <path d="M13 6L19 12L13 18"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"/>
                </svg>

            </button>

        </form>

        <div class="bottom-links">
            Remember your password?
            <a href="../login/login.html">Back to Login</a>
        </div>

    </div>

</main>

</body>
</html>
