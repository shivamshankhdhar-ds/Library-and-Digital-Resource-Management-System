<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Updated - Library Portal</title>

    <link rel="stylesheet" href="password-updated.css">
</head>
<body>

    <div class="page-container">

        <div class="success-icon">
            ✓
        </div>

        <div class="portal-name">
            LIBRARY PORTAL
        </div>

        <h1>Password Updated Successfully!</h1>

        <p class="subtitle">
            Your password has been updated successfully.
        </p>

        <div class="info-box">
            <p>
                Your student account password has been changed.
                You can now login using your new password.
            </p>
        </div>

        <a href="../login/login.html" class="login-button">
            Go to Login
        </a>

        <p class="bottom-text">
            Welcome back to your Library Portal.
        </p>

    </div>

</body>
</html>
