<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Library Portal</title>

    <link rel="stylesheet" href="reset-password.css">
</head>

<body>

    <main class="reset-page">

        <div class="reset-card">

            <!-- Header -->
            <div class="card-header">

                <div class="card-icon">

                    <svg viewBox="0 0 24 24" fill="none">

                        <rect x="4" y="10" width="16" height="11" rx="2"
                            stroke="currentColor"
                            stroke-width="1.7" />

                        <path d="M8 10V7C8 4.79 9.79 3 12 3C14.21 3 16 4.79 16 7V10"
                            stroke="currentColor"
                            stroke-width="1.7"
                            stroke-linecap="round" />

                        <path d="M12 14V17"
                            stroke="currentColor"
                            stroke-width="1.7"
                            stroke-linecap="round" />

                    </svg>

                </div>

                <div>

                    <span class="portal-label">
                        LIBRARY PORTAL
                    </span>

                    <h1>Reset Password</h1>

                    <p>Create a new password for your account</p>

                </div>

            </div>


            <!-- Information -->
            <div class="info-box">

                <p>
                    Create a strong password that you will use
                    to access your library account.
                </p>

            </div>


            <!-- Reset Password Form -->
            <form action="../password-updated/password-updated.html" method="get">

                <!-- New Password -->
                <div class="input-group">

                    <label for="new-password">
                        New Password
                    </label>

                    <div class="input-wrapper">

                        <svg viewBox="0 0 24 24" fill="none">

                            <rect x="4" y="10" width="16" height="11" rx="2"
                                stroke="currentColor"
                                stroke-width="1.7" />

                            <path d="M8 10V7C8 4.79 9.79 3 12 3C14.21 3 16 4.79 16 7V10"
                                stroke="currentColor"
                                stroke-width="1.7"
                                stroke-linecap="round" />

                        </svg>

                        <input
                            type="password"
                            id="new-password"
                            name="new-password"
                            placeholder="Enter your new password"
                            minlength="8"
                            required>

                    </div>

                </div>


                <!-- Confirm Password -->
                <div class="input-group">

                    <label for="confirm-password">
                        Confirm New Password
                    </label>

                    <div class="input-wrapper">

                        <svg viewBox="0 0 24 24" fill="none">

                            <rect x="4" y="10" width="16" height="11" rx="2"
                                stroke="currentColor"
                                stroke-width="1.7" />

                            <path d="M8 10V7C8 4.79 9.79 3 12 3C14.21 3 16 4.79 16 7V10"
                                stroke="currentColor"
                                stroke-width="1.7"
                                stroke-linecap="round" />

                            <path d="M9 15L11 17L15 13"
                                stroke="currentColor"
                                stroke-width="1.7"
                                stroke-linecap="round"
                                stroke-linejoin="round" />

                        </svg>

                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm-password"
                            placeholder="Confirm your new password"
                            minlength="8"
                            required>

                    </div>

                </div>


                <!-- Password Requirement -->
                <div class="password-note">

                    <span class="note-dot"></span>

                    Password must contain at least 8 characters.

                </div>


                <!-- Reset Button -->
                <button type="submit" class="reset-btn">

                    Reset Password

                    <svg viewBox="0 0 24 24" fill="none">

                        <path d="M5 12H19"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round" />

                        <path d="M13 6L19 12L13 18"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round" />

                    </svg>

                </button>

            </form>


            <!-- Login -->
            <div class="bottom-link">

                <a href="../login/login.html">
                    ← Back to Login
                </a>

            </div>

        </div>

    </main>

</body>

</html>
